name: SynBioCrow CI

on:
  push:
    branches: ["main", "develop/**"]
  pull_request:

jobs:
  contracts:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e .
      - name: Run contract tests
        run: python -m unittest discover -s tests -v

  doranet-api-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install SynBioCrow + pinned DORAnet
        run: python -m pip install -e ".[doranet]"
      - name: Verify real DORAnet API
        run: python scripts/smoke_doranet.py

  release-readiness:
    runs-on: ubuntu-latest
    needs: [contracts, doranet-api-contract]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install SynBioCrow core
        run: python -m pip install -e .
      - name: Run M7 release-readiness gate
        run: python scripts/m7_release_readiness.py

  m9-package:
    runs-on: ubuntu-latest
    needs: [release-readiness]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install SynBioCrow RC core
        run: python -m pip install -e .
      - name: Validate M9 package inputs
        run: python scripts/build_m9_release.py --check
      - name: Build M9 source/reproducibility bundle
        run: python scripts/build_m9_release.py --output-dir dist_m9
      - name: List M9 artifacts
        run: ls -lh dist_m9

  seven-engine-review-source:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: [contracts]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check captured native evidence
        run: |
          python -m pip install -e .
          python notebooks/seven_engine/check_native_integration.py evidence/m1_20_7
      - name: Build SOURCE ZIP, evidence bundle and hash manifest
        run: python scripts/build_seven_engine_review.py --output-dir dist_seven_engine
      - uses: actions/upload-artifact@v4
        with:
          name: SynBioCrow-M1.20.7-review-source
          path: dist_seven_engine
          if-no-files-found: error
