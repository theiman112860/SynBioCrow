name: SynBioCrow CI

on:
  push:
    branches: ["main", "develop/**"]
  pull_request:

jobs:
  contracts:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e .
      - name: Run contract tests
        run: python -m unittest discover -s tests -v

  doranet-api-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install SynBioCrow + pinned DORAnet
        run: python -m pip install -e ".[doranet]"
      - name: Verify real DORAnet API
        run: python scripts/smoke_doranet.py

  release-readiness:
    runs-on: ubuntu-latest
    needs: [contracts, doranet-api-contract]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install SynBioCrow core
        run: python -m pip install -e .
      - name: Run M7 release-readiness gate
        run: python scripts/m7_release_readiness.py
