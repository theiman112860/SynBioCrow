name: SynBioCrow CI

on:
  workflow_dispatch:
  push:
    branches: ["main", "develop/**"]
  pull_request:

jobs:
  contracts:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e . pytest
      - name: Run contract tests
        run: python -m unittest discover -s tests -v

  doranet-api-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install SynBioCrow + pinned DORAnet
        run: python -m pip install -e ".[doranet]"
      - name: Verify real DORAnet API
        run: python scripts/smoke_doranet.py

  release-readiness:
    runs-on: ubuntu-latest
    needs: [contracts, doranet-api-contract]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install SynBioCrow core
        run: python -m pip install -e .
      - name: Run M7 release-readiness gate
        run: python scripts/m7_release_readiness.py

  m9-package:
    runs-on: ubuntu-latest
    needs: [release-readiness]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install SynBioCrow RC core
        run: python -m pip install -e .
      - name: Validate M9 package inputs
        run: python scripts/build_m9_release.py --check
      - name: Build M9 source/reproducibility bundle
        run: python scripts/build_m9_release.py --output-dir dist_m9
      - name: List M9 artifacts
        run: ls -lh dist_m9
