name: SynBioCrow core governance
on:
  pull_request:
  push:
    branches: [main, develop/2.4]
  workflow_dispatch:
jobs:
  governance-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify governance files and no false certification
        run: python scripts/verify_core_governance.py
