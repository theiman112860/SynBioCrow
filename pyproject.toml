[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "synbiocrow"
version = "2.2.0.dev0"
description = "SynBioCrow computational synthetic-biology engine"
requires-python = ">=3.10"
license = {text = "Research release; see LICENSE.txt"}
readme = "README.md"

[project.optional-dependencies]
doranet = ["doranet==0.5.7a1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["synbiocrow*"]
